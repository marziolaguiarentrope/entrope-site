<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#000"/>
  <!-- Axolotl head -->
  <!-- Main head shape (wide rounded) -->
  <ellipse cx="16" cy="17" rx="8" ry="7" fill="#fff"/>
  <!-- Left gills (3 branches) -->
  <line x1="9" y1="12" x2="5" y2="8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="8.5" y1="14" x2="4" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="8.5" y1="16" x2="4" y2="16.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Right gills (3 branches) -->
  <line x1="23" y1="12" x2="27" y2="8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="23.5" y1="14" x2="28" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="23.5" y1="16" x2="28" y2="16.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="12.5" cy="15" r="1.5" fill="#000"/>
  <circle cx="19.5" cy="15" r="1.5" fill="#000"/>
  <!-- Smile -->
  <path d="M13 19.5 Q16 22 19 19.5" stroke="#000" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
