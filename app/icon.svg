<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#000"/>
  <!-- Antennae -->
  <line x1="13" y1="10" x2="11" y2="7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="10" x2="21" y2="7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Body (oval) -->
  <ellipse cx="16" cy="17.5" rx="6" ry="7.5" fill="#fff"/>
  <!-- Center line -->
  <line x1="16" y1="10" x2="16" y2="25" stroke="#000" stroke-width="1.5"/>
  <!-- Horizontal body segments -->
  <line x1="10" y1="15" x2="22" y2="15" stroke="#000" stroke-width="1.3"/>
  <line x1="10" y1="19" x2="22" y2="19" stroke="#000" stroke-width="1.3"/>
  <!-- Legs (left) -->
  <line x1="10.5" y1="13.5" x2="7.5" y2="11.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="17" x2="6.5" y2="17" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10.5" y1="21" x2="7.5" y2="23" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Legs (right) -->
  <line x1="21.5" y1="13.5" x2="24.5" y2="11.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="17" x2="25.5" y2="17" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21.5" y1="21" x2="24.5" y2="23" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="16" cy="10.5" r="3" fill="#fff"/>
  <!-- Eyes -->
  <circle cx="14.5" cy="10" r="0.9" fill="#000"/>
  <circle cx="17.5" cy="10" r="0.9" fill="#000"/>
</svg>
